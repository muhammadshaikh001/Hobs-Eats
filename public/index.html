<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#8A1F11" />
        <meta name="description" content="A modern restaurant website template. Easily customize the menu, branding, contact details and content for any restaurant or food business." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

        <title>Restaurant Name | Premium Restaurant Website Template</title>

        <link rel="canonical" href="https://example.com/" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

        <meta property="og:title" content="Restaurant Name | Premium Restaurant Website Template" />
        <meta property="og:description" content="A clean, modern and fully customizable restaurant website template for cafes, restaurants and food businesses." />
        <meta property="og:type" content="restaurant" />
        <meta name="twitter:card" content="summary_large_image" />

        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Restaurant",
          "name": "Restaurant Name",
          "image": "https://images.pexels.com/photos/10918160/pexels-photo-10918160.jpeg",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Business Address",
            "addressLocality": "City",
            "addressRegion": "State",
            "postalCode": "000000",
            "addressCountry": "IN"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 0,
            "longitude": 0
          },
          "telephone": "+91-00000-00000",
          "priceRange": "₹₹",
          "servesCuisine": ["Cuisine"],
          "openingHoursSpecification": [{
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
            "opens": "06:30",
            "closes": "23:00"
          }],
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "5",
            "reviewCount": "100"
          }
        }
        </script>

        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
